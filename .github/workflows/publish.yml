name: Publish Docker image

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    permissions:
      contents: read
    uses: donuk/github-build-to-dockerhub/.github/workflows/docker-publish.yml@9fa18073ee8b6da38a358600f70171f029fa832f # master@2026-11-17
    with:
      image_name: donuk/sslproxy
      test_script: |
        sh -n /entrypoint.sh
        caddy version
    secrets:
      dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}
